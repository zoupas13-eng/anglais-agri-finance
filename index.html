<style>
:root{
  --paper:#EDF0EA;
  --paper-2:#FFFFFF;
  --ink:#16302B;
  --ink-soft:#54655F;
  --line:#D2D9CE;
  --viridian:#1F6F5C;
  --viridian-dark:#154C40;
  --millet:#C89B2C;
  --alert:#A33328;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 0}

/* ---------- en-tête ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.top h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:-.2px}
.top .sub{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.09em}
.gauge{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.gauge b{color:var(--viridian);font-size:15px}

/* ---------- filtres ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-soft);
  padding:7px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit;
  transition:background .15s,color .15s,border-color .15s;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---------- carte ---------- */
.card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
  padding:20px 18px;box-shadow:0 1px 0 rgba(22,48,43,.04);
}
.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
.eyebrow .dot{color:var(--millet)}
.fr{font-size:23px;line-height:1.25;font-weight:600;margin:12px 0 0;letter-spacing:-.3px}
.en{font-family:var(--serif);font-size:27px;line-height:1.2;color:var(--viridian-dark);margin:14px 0 0}
.ex{font-family:var(--serif);font-size:15.5px;color:var(--ink-soft);font-style:italic;margin:10px 0 0;border-left:2px solid var(--millet);padding-left:11px}
.rule{height:1px;background:var(--line);margin:16px 0}

/* ---------- boutons ---------- */
.btn{
  display:block;width:100%;border:0;border-radius:11px;padding:15px 14px;
  font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer;
  background:var(--viridian);color:#fff;transition:transform .08s;
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:11px;font-size:14px}
.row{display:flex;gap:9px;margin-top:11px}
.row .btn{flex:1}
.btn.again{background:#fff;color:var(--alert);border:1.5px solid var(--alert)}
.btn.good{background:var(--viridian)}
.speak{
  border:1px solid var(--line);background:var(--paper);border-radius:9px;
  padding:8px 13px;font-family:inherit;font-size:13px;color:var(--ink-soft);cursor:pointer;margin-top:13px;
}
.speak:active{background:var(--line)}

/* ---------- quiz ---------- */
.opt{
  display:block;width:100%;text-align:left;background:var(--paper-2);border:1px solid var(--line);
  border-radius:11px;padding:14px 15px;margin-top:9px;font-family:var(--serif);font-size:17px;
  color:var(--ink);cursor:pointer;
}
.opt.ok{border-color:var(--viridian);background:#E8F2EE;color:var(--viridian-dark);font-weight:600}
.opt.ko{border-color:var(--alert);background:#F7EAE8;color:var(--alert);text-decoration:line-through}
.verdict{font-size:13.5px;margin-top:14px;color:var(--ink-soft)}
.verdict b{color:var(--ink)}

/* ---------- saisie ---------- */
input[type=text]{
  width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;
  font-family:var(--serif);font-size:19px;background:var(--paper-2);color:var(--ink);margin-top:14px;
}
input[type=text]:focus{outline:2px solid var(--viridian);outline-offset:1px;border-color:transparent}

/* ---------- pitch ---------- */
.dial{position:relative;width:186px;height:186px;margin:6px auto 2px}
.dial svg{transform:rotate(-90deg)}
.dial .t{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.dial .t .num{font-family:var(--serif);font-size:38px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.dial .t .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);margin-top:2px}
.blocks{margin-top:14px}
.blk{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);opacity:.4;transition:opacity .3s}
.blk.on{opacity:1}
.blk .tm{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--millet);width:44px;flex:0 0 44px;padding-top:3px;font-weight:700}
.blk .bt{font-size:14.5px;font-weight:600}
.blk .bg{font-size:12.5px;color:var(--ink-soft)}
.blk .be{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--viridian-dark);margin-top:5px;display:none}
.blk.on .be{display:block}

/* ---------- progression ---------- */
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--viridian);border-radius:99px;transition:width .4s}
.prow{padding:13px 0;border-bottom:1px solid var(--line)}
.prow .h{display:flex;justify-content:space-between;font-size:14px}
.prow .h span{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:12.5px}
.mini{font-size:12.5px;color:var(--ink-soft);margin-top:5px}

/* ---------- navigation ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper-2);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9;
}
nav button{
  flex:1;border:0;background:none;padding:11px 2px 12px;font-family:inherit;font-size:10.5px;
  color:var(--ink-soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  letter-spacing:.02em;
}
nav button .ic{font-size:17px;line-height:1}
nav button[aria-current="true"]{color:var(--viridian);font-weight:700}
.hidden{display:none!important}
.center{text-align:center}
.note{font-size:12.5px;color:var(--ink-soft);margin-top:14px;text-align:center}
.count{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:12px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">Réviser</h1>
      <div class="sub" id="subtitle">Lexique agri-finance</div>
    </div>
    <div class="gauge"><b id="gActive">0</b> / <span id="gTotal">0</span> actifs</div>
  </div>
  <div id="chips" class="chips"></div>
  <div id="view"></div>
</div>

<nav>
  <button data-tab="rev" aria-current="true"><span class="ic">◧</span>Réviser</button>
  <button data-tab="quiz"><span class="ic">◎</span>Quiz</button>
  <button data-tab="ecrire"><span class="ic">✎</span>Écrire</button>
  <button data-tab="pitch"><span class="ic">◔</span>Pitch</button>
  <button data-tab="prog"><span class="ic">▤</span>Suivi</button>
</nav>

nal rate of return of 22% over five years."}, {"t": "3:15", "s": 195, "b": "Le financement demandé", "g": "Montant, structure, usage des fonds.", "e": "We are seeking 45 million FCFA: 30% equity, 20% grant and 50% debt, mainly for storage and processing equipment."}, {"t": "4:00", "s": 240, "b": "L'impact", "g": "Emplois, genre, climat, territoire.", "e": "The unit creates 18 direct jobs, two thirds of them for women, and cuts post-harvest losses by half."}, {"t": "4:30", "s": 270, "b": "Conclusion et pas suivant", "g": "Une phrase de synthèse et une demande claire.", "e": "To sum up: a proven market, a de-risked structure and a bankable model. What we'd like from you today is a decision on the guarantee facility."}]};
const CARDS = DATA.cards, FAUX = DATA.faux, PITCH = DATA.pitch;
const DOMAINS = [...new Set(CARDS.map(c=>c.d))];
const INTERVALS = [0,1,3,7,21];            // jours, boîtes de Leitner 1 à 5
const DAY = 86400000;

let state = {box:{}, due:{}, filter:"Tous", streak:0, last:null, done:0};
let mem = null;

const KEY = "agrifin-en-progress";
async function readRaw(){
  try{ const v = localStorage.getItem(KEY); if(v) return v; }catch(e){}
  try{ const r = await window.storage.get(KEY); if(r && r.value) return r.value; }catch(e){}
  return mem;
}
async function writeRaw(s){
  try{ localStorage.setItem(KEY, s); return; }catch(e){}
  try{ await window.storage.set(KEY, s); return; }catch(e){}
  mem = s;
}
async function load(){
  try{
    const raw = await readRaw();
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){ /* première utilisation */ }
  const t = today();
  if(state.last !== t){
    if(state.last === t-1) state.streak = (state.streak||0)+1; else state.streak = 1;
    state.last = t; state.done = 0;
  }
  render();
}
function today(){ return Math.floor(Date.now()/DAY); }
async function save(){
  await writeRaw(JSON.stringify(state));
  paintGauge();
}

function box(i){ return state.box[i] || 1; }
function isDue(i){ return (state.due[i]||0) <= today(); }
function pool(){
  const f = state.filter;
  return CARDS.map((c,i)=>({c,i})).filter(o=> f==="Tous" || o.c.d===f);
}
function duePool(){ return pool().filter(o=>isDue(o.i)); }
function grade(i, ok){
  const b = box(i);
  const nb = ok ? Math.min(5, b+1) : 1;
  state.box[i] = nb;
  state.due[i] = today() + INTERVALS[nb-1];
  state.done = (state.done||0)+1;
  save();
}
function activeCount(){ return Object.values(state.box).filter(b=>b>=4).length; }
function paintGauge(){
  document.getElementById("gActive").textContent = activeCount();
  document.getElementById("gTotal").textContent = CARDS.length;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function speak(txt){
  try{
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = "en-GB"; u.rate = .92;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
          .replace(/\(.*?\)/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
}
function variants(en){
  return en.split("/").map(x=>norm(x)).filter(Boolean);
}

/* ------------------------------------------------------------------ vues */
let tab = "rev", cur = null, shown = false, answered = false;
const V = () => document.getElementById("view");
const TITLES = {
  rev:["Réviser","Carte à carte, à voix haute"],
  quiz:["Quiz","Reconnaître le bon terme"],
  ecrire:["Écrire","Produire le terme sans aide"],
  pitch:["Pitch","Présenter un projet en 5 minutes"],
  prog:["Suivi","Où en est le lexique actif"]
};

function buildChips(){
  const box = document.getElementById("chips");
  box.innerHTML = "";
  if(tab==="pitch"||tab==="prog"){ box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  ["Tous",...DOMAINS].forEach(d=>{
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = d;
    b.setAttribute("aria-pressed", state.filter===d ? "true":"false");
    b.onclick = ()=>{ state.filter = d; cur=null; save(); render(); };
    box.appendChild(b);
  });
}

function render(){
  document.getElementById("title").textContent = TITLES[tab][0];
  document.getElementById("subtitle").textContent = TITLES[tab][1];
  buildChips(); paintGauge();
  ({rev:viewRev, quiz:viewQuiz, ecrire:viewEcrire, pitch:viewPitch, prog:viewProg})[tab]();
}

/* --- réviser --- */
function viewRev(){
  const d = duePool();
  if(!d.length){
    V().innerHTML = `<div class="card center">
      <div class="eyebrow">Série terminée</div>
      <p class="fr" style="font-size:19px">Rien à revoir ici aujourd'hui.</p>
      <p class="mini">Les cartes réapparaissent selon leur boîte : 1 jour, 3 jours, 1 semaine, puis 3 semaines. Changez de domaine ou passez au quiz.</p>
      </div>`;
    return;
  }
  if(!cur || !d.find(o=>o.i===cur.i)) cur = pick(d);
  const {c,i} = cur;
  V().innerHTML = `<div class="card">
      <div class="eyebrow">${c.d} <span class="dot">·</span> boîte ${box(i)} sur 5</div>
      <p class="fr">${c.f}</p>
      ${shown ? `<div class="rule"></div>
        <p class="en">${c.e}</p>
        ${c.x?`<p class="ex">${c.x}</p>`:""}
        <button class="speak" id="sp">▸ Écouter la prononciation</button>` : ""}
    </div>
    ${shown
      ? `<div class="row">
           <button class="btn again" id="ko">Pas su</button>
           <button class="btn good" id="ok">Su</button>
         </div>
         <p class="note">Ne cochez « Su » que si vous l'avez dit à voix haute.</p>`
      : `<div class="row"><button class="btn" id="show">Dire à voix haute, puis afficher</button></div>`}
    <p class="count">${d.length} carte${d.length>1?"s":""} à revoir · ${state.done||0} traitée${(state.done||0)>1?"s":""} aujourd'hui</p>`;
  if(shown){
    document.getElementById("sp").onclick = ()=>speak(c.x || c.e);
    document.getElementById("ok").onclick = ()=>{ grade(i,true); shown=false; cur=null; render(); };
    document.getElementById("ko").onclick = ()=>{ grade(i,false); shown=false; cur=null; render(); };
  }else{
    document.getElementById("show").onclick = ()=>{ shown=true; render(); };
  }
}

/* --- quiz --- */
function viewQuiz(){
  const p = pool();
  if(!cur){
    answered = false;
    const useFaux = FAUX.length && Math.random() < .22 && state.filter==="Tous";
    if(useFaux){
      const f = pick(FAUX);
      const third = pick(FAUX.filter(x=>x.g!==f.g && x.g!==f.b)).g;
      cur = {type:"faux", f, opts: shuffle([f.g, f.b, third])};
    }else{
      const o = pick(p);
      const others = p.filter(x=>x.i!==o.i);
      const wrong = shuffle(others).slice(0,3).map(x=>x.c.e);
      cur = {type:"std", o, opts: shuffle([o.c.e, ...wrong])};
    }
  }
  if(cur.type==="faux"){
    const f = cur.f;
    V().innerHTML = `<div class="card">
        <div class="eyebrow">Piège classique <span class="dot">·</span> faux ami</div>
        <p class="fr">${f.f}</p>
        <p class="mini">Quel terme employer en anglais professionnel ?</p>
        <div id="opts"></div>
        <div id="verdict"></div>
      </div>
      <div class="row"><button class="btn ghost" id="next">Suivant</button></div>`;
    fillOpts(cur.opts, f.g, ()=>{
      document.getElementById("verdict").innerHTML =
        `<div class="verdict">À éviter : <b>${f.b}</b>. ${f.w||""}</div>`;
    });
  }else{
    const c = cur.o.c;
    V().innerHTML = `<div class="card">
        <div class="eyebrow">${c.d}</div>
        <p class="fr">${c.f}</p>
        <div id="opts"></div>
        <div id="verdict"></div>
      </div>
      <div class="row"><button class="btn ghost" id="next">Suivant</button></div>`;
    fillOpts(cur.opts, c.e, ok=>{
      grade(cur.o.i, ok);
      if(c.x) document.getElementById("verdict").innerHTML = `<div class="verdict">${c.x}</div>`;
    });
  }
  document.getElementById("next").onclick = ()=>{ cur=null; render(); };
}
function fillOpts(opts, right, after){
  const host = document.getElementById("opts");
  opts.forEach(o=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = ()=>{
      if(answered) return; answered = true;
      const ok = o===right;
      [...host.children].forEach(ch=>{
        if(ch.textContent===right) ch.classList.add("ok");
        else if(ch===b) ch.classList.add("ko");
      });
      speak(right); after(ok);
    };
    host.appendChild(b);
  });
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* --- écrire --- */
function viewEcrire(){
  const p = pool();
  if(!cur){ cur = {o:pick(p)}; answered=false; }
  const c = cur.o.c;
  V().innerHTML = `<div class="card">
      <div class="eyebrow">${c.d} <span class="dot">·</span> production écrite</div>
      <p class="fr">${c.f}</p>
      <input type="text" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="en anglais…">
      <div id="verdict"></div>
    </div>
    <div class="row"><button class="btn" id="check">Vérifier</button></div>
    <p class="note">Les variantes séparées par « / » sont toutes acceptées.</p>`;
  const inp = document.getElementById("inp");
  inp.focus();
  const check = ()=>{
    if(answered){ cur=null; render(); return; }
    answered = true;
    const v = norm(inp.value);
    const ok = variants(c.e).some(x=> x===v || (v.length>3 && x.startsWith(v) && v.length>=x.length-2));
    grade(cur.o.i, ok);
    document.getElementById("verdict").innerHTML =
      `<div class="verdict" style="color:${ok?"var(--viridian)":"var(--alert)"};font-weight:600">${ok?"Correct":"Terme attendu"}</div>
       <p class="en" style="font-size:22px">${c.e}</p>${c.x?`<p class="ex">${c.x}</p>`:""}`;
    document.getElementById("check").textContent = "Suivant";
    speak(c.e);
  };
  document.getElementById("check").onclick = check;
  inp.onkeydown = e=>{ if(e.key==="Enter") check(); };
}

/* --- pitch --- */
let pt = {t:0, run:false, id:null};
function viewPitch(){
  const total = 300;
  V().innerHTML = `<div class="card">
      <div class="dial">
        <svg width="186" height="186" viewBox="0 0 186 186">
          <circle cx="93" cy="93" r="82" fill="none" stroke="var(--line)" stroke-width="9"/>
          <circle id="arc" cx="93" cy="93" r="82" fill="none" stroke="var(--viridian)" stroke-width="9"
                  stroke-linecap="round" stroke-dasharray="515" stroke-dashoffset="515"/>
        </svg>
        <div class="t"><div class="num" id="clock">5:00</div><div class="lbl" id="phase">prêt</div></div>
      </div>
      <div class="row">
        <button class="btn small" id="go">Démarrer</button>
        <button class="btn small ghost" id="rst">Remettre à zéro</button>
      </div>
      <div class="blocks" id="blocks"></div>
    </div>
    <p class="note">Enregistrez-vous, puis réécoutez : c'est la réécoute qui corrige, pas la répétition.</p>`;
  const host = document.getElementById("blocks");
  PITCH.forEach((b,k)=>{
    const el = document.createElement("div");
    el.className = "blk"; el.id = "blk"+k;
    el.innerHTML = `<div class="tm">${b.t}</div><div><div class="bt">${b.b}</div>
                    <div class="bg">${b.g}</div><div class="be">${b.e}</div></div>`;
    host.appendChild(el);
  });
  document.getElementById("go").onclick = toggle;
  document.getElementById("rst").onclick = ()=>{ stop(); pt.t=0; paintPitch(); };
  paintPitch();
}
function toggle(){
  if(pt.run){ stop(); } else {
    pt.run = true; document.getElementById("go").textContent = "Pause";
    pt.id = setInterval(()=>{ pt.t++; if(pt.t>=300){ stop(); pt.t=300; } paintPitch(); }, 1000);
  }
}
function stop(){
  pt.run=false; clearInterval(pt.id);
  const g = document.getElementById("go"); if(g) g.textContent = pt.t?"Reprendre":"Démarrer";
}
function paintPitch(){
  const left = 300 - pt.t;
  const cl = document.getElementById("clock"); if(!cl) return;
  cl.textContent = Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  document.getElementById("arc").setAttribute("stroke-dashoffset", 515 - 515*(pt.t/300));
  let k = 0;
  PITCH.forEach((b,j)=>{ if(pt.t >= b.s) k = j; });
  document.getElementById("phase").textContent = pt.t ? PITCH[k].b : "prêt";
  PITCH.forEach((b,j)=>{
    const el = document.getElementById("blk"+j);
    if(el) el.classList.toggle("on", pt.t>0 && j===k);
  });
}

/* --- suivi --- */
function viewProg(){
  const rows = DOMAINS.map(d=>{
    const idx = CARDS.map((c,i)=>({c,i})).filter(o=>o.c.d===d);
    const act = idx.filter(o=>box(o.i)>=4).length;
    return {d, n:idx.length, act};
  });
  const tot = rows.reduce((s,r)=>s+r.n,0), ta = rows.reduce((s,r)=>s+r.act,0);
  V().innerHTML = `<div class="card">
      <div class="eyebrow">Lexique en usage actif</div>
      <p class="fr" style="font-size:34px;color:var(--viridian-dark)">${Math.round(ta/tot*100)}<span style="font-size:19px">%</span></p>
      <div class="bar"><i style="width:${(ta/tot*100).toFixed(1)}%"></i></div>
      <p class="mini">${ta} termes sur ${tot} atteignent la boîte 4 ou 5. Cible à douze semaines : 40 %.</p>
      <div class="rule"></div>
      <div class="eyebrow">Régularité</div>
      <p class="mini" style="margin-top:6px"><b style="color:var(--ink);font-size:15px">${state.streak||1} jour${(state.streak||1)>1?"s":""} d'affilée</b> · ${state.done||0} carte${(state.done||0)>1?"s":""} traitée${(state.done||0)>1?"s":""} aujourd'hui</p>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="eyebrow">Par domaine</div>
      ${rows.map(r=>`<div class="prow">
        <div class="h"><b>${r.d}</b><span>${r.act} / ${r.n}</span></div>
        <div class="bar"><i style="width:${(r.act/r.n*100).toFixed(1)}%"></i></div>
      </div>`).join("")}
    </div>
    <p class="note">Une carte entre en usage actif après quatre rappels réussis espacés.</p>`;
}

/* --- navigation --- */
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-current","false"));
    b.setAttribute("aria-current","true");
    stop(); tab = b.dataset.tab; cur = null; shown = false; answered = false;
    window.scrollTo(0,0); render();
  };
});
load();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
